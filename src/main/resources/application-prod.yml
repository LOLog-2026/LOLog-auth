# 배포용 설정. 값은 파일에 적지 않고 서버의 환경 변수로 넣는다(deployment.md 4장).
# DB는 lolog-api와 같은 DB_URL(lolog DB, public 스키마)이고, 스키마는 DB_URL의 currentSchema로 지정한다.
# JWT_SECRET, INTERNAL_TOKEN, API_INTERNAL_URL은 application.yml이 읽는다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    # 리프레시 토큰 저장. lolog-api와 같은 이름(REDIS_HOST, REDIS_PORT, REDIS_PASSWORD)이다.
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  # 가입 인증번호 메일. Gmail SMTP(smtp.gmail.com:587, STARTTLS)와 보내는 계정의 앱 비밀번호(deployment.md 4장).
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      # 메일 서버가 응답하지 않아도 요청이 오래 붙잡히지 않게 한다(밀리초).
      # Gmail은 보내기 한 번에 4초 안팎이 걸려서(로컬에서 잼) 넉넉히 10초로 둔다.
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

lolog:
  mail:
    # 실제로 보낸다. 로컬 전용 콘솔 출력(log-only)은 배포에서 켜지 않는다.
    log-only: false
    from: ${MAIL_FROM}

server:
  # HTTPS는 Nginx가 끝낸다. Nginx가 붙인 X-Forwarded-* 헤더로 원래 주소(https, 호스트)를 알아낸다(deployment.md 4장).
  forward-headers-strategy: framework

# 구글 웹 클라이언트 ID(application.yml 참고). 배포에서는 없으면 서버가 뜨지 않게 기본값을 두지 않는다.
# 다른 lolog 설정과 최상위 키가 겹치지 않게 한 줄로 쓴다.
lolog.social.google.client-id: ${GOOGLE_WEB_CLIENT_ID}

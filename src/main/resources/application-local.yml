# 로컬 개발용 설정. lolog-api의 compose.yaml이 띄운 PostgreSQL·Redis를 같이 쓰고,
# DB만 lolog_auth로 따로 둔다. 처음 한 번 DB를 만들어야 한다(README 참고).
spring:
  config:
    # Spring은 .env를 자동으로 읽지 않으므로 직접 불러온다. 프로젝트 루트에서 실행해야 찾는다.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/lolog_auth
    username: myuser
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379

  # MAIL_LOG_ONLY=false로 실제 메일을 보내 볼 때만 쓴다(.env의 MAIL_* 값).
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

lolog:
  mail:
    # 기본은 메일을 보내지 않고 인증번호를 콘솔에 찍는다(Gmail 계정 없이 시험).
    log-only: ${MAIL_LOG_ONLY:true}
  api:
    # 내 PC에서 띄운 lolog-api
    internal-url: http://localhost:8080

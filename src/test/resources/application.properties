# 테스트 공통 값. 실제 비밀값이 아니라 시험용 자리 값이다.
JWT_SECRET=test-jwt-secret-at-least-32-bytes-long!!
INTERNAL_TOKEN=internal-test-token
# 테스트에서는 아무것도 없는 주소. 탈퇴 테스트는 가짜 lolog-api를 띄워 이 값을 바꾼다.
API_INTERNAL_URL=http://127.0.0.1:1
# 테스트 중에는 다시 부르기가 저절로 돌지 않게 길게 둔다. 테스트가 직접 부른다.
lolog.user-data-delete.retry-delay=PT1H
# 테스트는 SMTP 없이 돈다. 메일은 FakeMailer가 받는다.
lolog.mail.log-only=true
